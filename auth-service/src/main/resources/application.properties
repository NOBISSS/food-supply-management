spring.application.name=food-supply-management
server.port=8081

# database - same credentials for the whole team, matches compose.yml
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/food_supply_db
spring.datasource.username=food_admin
spring.datasource.password=team18pass123

# flyway migrations
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# jpa should only validate against flyway-managed schema, never auto-generate it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#temporarily
server.error.include-message=always
server.error.include-stacktrace=on_param

# jwt
jwt.secret=team18foodsupplysecretkeychangeitlater1234567890
jwt.expiration-ms=86400000