services:
  postgres:
    image: postgres:18
    container_name: food-supply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_supply_db}
      POSTGRES_USER: ${POSTGRES_USER:-food_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-team18pass123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food_admin} -d ${POSTGRES_DB:-food_supply_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: