services:
  postgres:
    image: postgres:18
    container_name: food-supply-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: food_supply_db
      POSTGRES_USER: food_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_admin -d food_supply_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: