spring.application.name=food-supply-management
server.port=8081

# PostgreSQL Docker database
spring.datasource.url=jdbc:postgresql://localhost:5433/food_supply_db
spring.datasource.username=food_admin
spring.datasource.password=${DB_PASSWORD}

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

debug=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG

