spring.application.name=beneficiary-service
server.port=8082

# same Postgres instance as auth-service, but this service does NOT own the schema
spring.datasource.url=jdbc:postgresql://localhost:5433/food_supply_db
spring.datasource.username=food_admin
spring.datasource.password=team18pass123

# auth-service runs Flyway for the whole shared DB; this service must not
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# must be IDENTICAL to auth-service's jwt.secret — this service validates tokens auth-service issued
jwt.secret=team18foodsupplysecretkeychangeitlater1234567890
jwt.expiration-ms=86400000
